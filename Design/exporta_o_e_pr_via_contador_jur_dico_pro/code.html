<script>
        // Simple interactivity for checkboxes to add visual feedback on the parent label
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const label = this.closest('label');
                if (this.checked) {
                    label.classList.add('bg-surface-container-low', 'border-outline-variant');
                } else {
                    label.classList.remove('bg-surface-container-low', 'border-outline-variant');
                }
            });
        });
